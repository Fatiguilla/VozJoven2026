<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de publicación | La Voz Joven</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img
          src="assets/logo-la-voz-joven.jpeg"
          alt="La Voz Joven"
          style="max-width:210px;max-height:70px;object-fit:contain"
        >
      </a>
      <a href="index.html" class="nav-back">
        ← Volver al periódico
      </a>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-card">
      <span class="section-kicker">ÁREA DE REDACCIÓN</span>
      <h1>Panel de publicación</h1>
      <p>Administra las noticias de La Voz Joven.</p>

      <!-- ACCESO CON CONTRASEÑA -->
      <form id="loginForm">
        <label for="password">Contraseña de acceso</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Escribe la contraseña"
        >

        <button class="btn btn-primary" type="submit">
          Ingresar al panel
        </button>

        <p id="loginMessage" role="status"></p>
      </form>

      <!-- PANEL DE NOTICIAS -->
      <section id="editorPanel" hidden>
        <h2>Nueva noticia</h2>
        <p id="sessionMessage" role="status">
          Acceso al panel habilitado.
        </p>

        <form id="newsForm">
          <label for="title">Título de la noticia</label>
          <input id="title" type="text" required maxlength="200">

          <label for="category">Sección</label>
          <select id="category" required>
            <option value="">Selecciona una sección</option>
            <option value="educacion">Educación</option>
            <option value="salud">Salud</option>
            <option value="cultura">Cultura</option>
            <option value="investigacion">Investigación</option>
            <option value="desarrollo-local">Desarrollo local</option>
            <option value="deporte">Deporte</option>
            <option value="opinion">Presentación y opinión personal</option>
            <option value="matando-el-tiempo">Matando el tiempo</option>
            <option value="tu-opinion-cuenta">Tu opinión cuenta</option>
            <option value="clasificados">Clasificados</option>
          </select>

          <label for="date">Fecha de publicación</label>
          <input id="date" type="date" required>

          <label for="author">Autor o autora</label>
          <input id="author" type="text" maxlength="150">

          <label for="summary">Resumen</label>
          <textarea
            id="summary"
            rows="3"
            maxlength="500"
            placeholder="Breve presentación de la noticia"
          ></textarea>

          <label for="content">Contenido completo</label>
          <textarea
            id="content"
            rows="10"
            required
            placeholder="Redacta aquí la noticia"
          ></textarea>

          <label for="cover">Fotografía de portada</label>
          <input id="cover" type="file" accept="image/*">

          <img
            id="coverPreview"
            alt="Vista previa de la fotografía"
            hidden
            style="max-width:100%;max-height:280px;object-fit:contain;margin-top:12px"
          >

          <label for="coverAlt">Descripción de la fotografía</label>
          <input id="coverAlt" type="text" maxlength="250">

          <label for="coverCaption">Pie de fotografía</label>
          <input id="coverCaption" type="text" maxlength="250">

          <label for="gallery">Enlaces de fotos adicionales (opcional)</label>
          <textarea
            id="gallery"
            rows="3"
            placeholder="Un enlace por línea, si ya tienes las fotos alojadas en internet"
          ></textarea>

          <button class="btn btn-primary" type="submit">
            Publicar noticia
          </button>

          <button class="btn btn-ghost" id="clearForm" type="button">
            Limpiar formulario
          </button>

          <button class="btn btn-ghost" id="logout" type="button">
            Cerrar sesión
          </button>

          <p id="publishMessage" role="status"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="newsroom.js"></script>

  <script>
    'use strict';

    // CONFIGURACIÓN DE SUPABASE
    // La URL debe ser la dirección raíz, sin /rest/v1/
    const SUPABASE_URL =
      'https://wsfdjmhpfqwunyguloqo.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_-1dCf4mJ0AgDVKXXUt7Z9g_wOA-jgmt';

    // CONTRASEÑA SENCILLA DE PRUEBA
    const ADMIN_PASSWORD = '12345';

    const $ = (selector) => document.querySelector(selector);

    const loginForm = $('#loginForm');
    const editorPanel = $('#editorPanel');
    const newsForm = $('#newsForm');
    const loginMessage = $('#loginMessage');
    const publishMessage = $('#publishMessage');
    const coverInput = $('#cover');
    const coverPreview = $('#coverPreview');

    let supabaseClient = null;
    let isUnlocked = false;
    let previewUrl = null;

    function setToday() {
      const now = new Date();
      const localDate = new Date(
        now.getTime() - now.getTimezoneOffset() * 60000
      ).toISOString().slice(0, 10);

      $('#date').value = localDate;
    }

    // INGRESO CON CONTRASEÑA
    function login(event) {
      event.preventDefault();

      const password = $('#password').value;

      if (password === ADMIN_PASSWORD) {
        isUnlocked = true;
        loginForm.hidden = true;
        editorPanel.hidden = false;
        loginMessage.textContent = '';
        $('#password').value = '';
        $('#sessionMessage').textContent =
          'Acceso al panel habilitado.';
      } else {
        loginMessage.textContent =
          'Contraseña incorrecta. Intenta nuevamente.';
        $('#password').value = '';
        $('#password').focus();
      }
    }

    // SUBIR FOTOGRAFÍA A SUPABASE
    async function uploadImage(file) {
      if (!file) return null;

      if (!file.type.startsWith('image/')) {
        throw new Error('El archivo seleccionado no es una imagen.');
      }

      const maxSize = 5 * 1024 * 1024;

      if (file.size > maxSize) {
        throw new Error(
          'La fotografía supera los 5 MB. Elige una imagen más pequeña.'
        );
      }

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const filePath =
        'public/' + crypto.randomUUID() + '-' + safeName;

      const { error } = await supabaseClient.storage
        .from('noticias')
        .upload(filePath, file, {
          cacheControl: '3600',
          upsert: false
        });

      if (error) throw error;

      const { data } = supabaseClient.storage
        .from('noticias')
        .getPublicUrl(filePath);

      return data.publicUrl;
    }

    // PUBLICAR NOTICIA
    async function publishNews(event) {
      event.preventDefault();

      if (!isUnlocked) {
        publishMessage.textContent =
          'Ingresa la contraseña para publicar.';
        return;
      }

      const submitButton = newsForm.querySelector(
        'button[type="submit"]'
      );

      submitButton.disabled = true;
      publishMessage.textContent = 'Publicando noticia...';

      try {
        let coverUrl = null;

        if (coverInput.files && coverInput.files[0]) {
          coverUrl = await uploadImage(coverInput.files[0]);
        }

        const gallery = $('#gallery').value
          .split('\n')
          .map(url => url.trim())
          .filter(Boolean)
          .map(url => ({
            url,
            alt: ''
          }));

        const post = {
          title: $('#title').value.trim(),
          category: $('#category').value,
          date: $('#date').value,
          author: $('#author').value.trim() || null,
          summary: $('#summary').value.trim() || null,
          content: $('#content').value.trim(),
          cover_url: coverUrl,
          cover_alt: $('#coverAlt').value.trim() || null,
          cover_caption: $('#coverCaption').value.trim() || null,
          gallery
        };

        const { error } = await supabaseClient
          .from('posts')
          .insert([post]);

        if (error) throw error;

        publishMessage.textContent =
          '¡Noticia publicada correctamente!';

        newsForm.reset();
        setToday();

        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }

        coverPreview.removeAttribute('src');
        coverPreview.hidden = true;

      } catch (error) {
        console.error('Error al publicar:', error);
        publishMessage.textContent =
          'No se pudo publicar la noticia: ' + error.message;
      } finally {
        submitButton.disabled = false;
      }
    }

    // VISTA PREVIA DE LA FOTOGRAFÍA
    function previewCover() {
      const file = coverInput.files && coverInput.files[0];

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      if (!file) {
        coverPreview.removeAttribute('src');
        coverPreview.hidden = true;
        return;
      }

      if (!file.type.startsWith('image/')) {
        publishMessage.textContent =
          'Selecciona un archivo de imagen válido.';
        coverInput.value = '';
        coverPreview.hidden = true;
        return;
      }

      previewUrl = URL.createObjectURL(file);
      coverPreview.src = previewUrl;
      coverPreview.hidden = false;
      publishMessage.textContent = '';
    }

    // LIMPIAR FORMULARIO
    function clearNewsForm() {
      newsForm.reset();
      setToday();
      publishMessage.textContent = '';

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      coverPreview.removeAttribute('src');
      coverPreview.hidden = true;
    }

    // CERRAR EL PANEL
    function logout() {
      isUnlocked = false;
      editorPanel.hidden = true;
      loginForm.hidden = false;
      loginMessage.textContent =
        'Has cerrado el acceso al panel.';
      publishMessage.textContent = '';
      newsForm.reset();
      setToday();

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }

      coverPreview.removeAttribute('src');
      coverPreview.hidden = true;
      $('#password').focus();
    }

    // INICIAR APLICACIÓN
    try {
      if (
        !SUPABASE_URL.startsWith('https://') ||
        !SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')
      ) {
        throw new Error(
          'Revisa la URL y la clave publicable de Supabase.'
        );
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      loginForm.addEventListener('submit', login);
      newsForm.addEventListener('submit', publishNews);
      $('#logout').addEventListener('click', logout);
      $('#clearForm').addEventListener('click', clearNewsForm);
      coverInput.addEventListener('change', previewCover);

      setToday();

    } catch (error) {
      loginMessage.textContent =
        'Error de configuración: ' + error.message;
      console.error(error);
    }
  </script>
</body>
</html>
