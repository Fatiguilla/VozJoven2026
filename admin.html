<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de publicación | La Voz Joven</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-page{max-width:980px;margin:2rem auto;padding:0 1rem}
    .admin-card{background:#fff;border-radius:16px;padding:clamp(1rem,3vw,2rem);box-shadow:0 8px 30px #18233812}
    .admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    .admin-card label{display:block;font-weight:600;margin:.8rem 0 .35rem}
    .admin-card input:not([type=file]),.admin-card select,.admin-card textarea{width:100%;box-sizing:border-box;padding:.75rem;border:1px solid #ccd2da;border-radius:8px;font:inherit}
    .admin-card textarea{min-height:150px}
    .admin-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
    .upload-preview{display:flex;gap:.6rem;flex-wrap:wrap;margin:.5rem 0}
    .upload-preview img{width:120px;height:90px;object-fit:cover;border-radius:8px}
    .hidden{display:none!important}
    #loginMessage,#publishMessage{min-height:1.4em}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo-la-voz-joven.jpeg" alt="La Voz Joven" style="max-width:210px;max-height:70px;object-fit:contain">
      </a>
      <a href="index.html" class="nav-back">← Volver al periódico</a>
    </div>
  </header>

  <main class="admin-page">
    <section class="admin-card">
      <span class="section-kicker">ÁREA DE REDACCIÓN</span>
      <h1>Panel de publicación</h1>
      <p>Redacta y publica noticias en la sección correspondiente.</p>

      <form id="loginForm">
        <label for="password">Contraseña de acceso</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="Ingresa la contraseña">
        <button class="btn btn-primary" type="submit">Ingresar</button>
        <p id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <form id="newsForm" class="hidden">
        <div class="admin-grid">
          <div>
            <label for="title">Titular de la noticia *</label>
            <input id="title" required maxlength="140" placeholder="Escribe un titular claro">
          </div>
          <div>
            <label for="category">Sección *</label>
            <select id="category" required>
              <option value="Presentación">Presentación</option>
              <option value="Opinión personal">Opinión personal</option>
              <option value="Educación">Educación</option>
              <option value="Salud">Salud</option>
              <option value="Cultura">Cultura</option>
              <option value="Investigación">Investigación</option>
              <option value="Desarrollo local">Desarrollo local</option>
              <option value="Deporte">Deporte</option>
              <option value="Matando el tiempo">Matando el tiempo</option>
              <option value="Tu opinión cuenta">Tu opinión cuenta</option>
              <option value="Clasificados">Clasificados</option>
            </select>
          </div>
          <div>
            <label for="date">Fecha de publicación *</label>
            <input id="date" type="date" required>
          </div>
          <div>
            <label for="author">Autor / fuente</label>
            <input id="author" maxlength="100" placeholder="Nombre del periodista">
          </div>
        </div>

        <label for="summary">Resumen para la página principal</label>
        <textarea id="summary" rows="3" maxlength="350" placeholder="Síntesis breve que aparecerá junto al titular."></textarea>

        <label for="cover">Fotografía principal *</label>
        <input id="cover" type="file" accept="image/*" required>
        <div id="coverPreview" class="upload-preview"></div>

        <div class="admin-grid">
          <div>
            <label for="coverAlt">Descripción de la foto</label>
            <input id="coverAlt" placeholder="Qué aparece en la fotografía">
          </div>
          <div>
            <label for="coverCaption">Pie de foto</label>
            <input id="coverCaption" placeholder="Lugar, fecha o crédito fotográfico">
          </div>
        </div>

        <label for="gallery">Fotografías adicionales (opcional)</label>
        <input id="gallery" type="file" accept="image/*" multiple>
        <div id="galleryPreview" class="upload-preview"></div>

        <label for="content">Contenido completo de la noticia *</label>
        <textarea id="content" required placeholder="Redacta aquí la noticia completa. Separa los párrafos con una línea en blanco."></textarea>

        <div class="admin-actions">
          <button class="btn btn-primary" id="publishButton" type="submit">Publicar noticia</button>
          <button class="btn btn-ghost" id="clearForm" type="button">Limpiar formulario</button>
          <button class="btn btn-ghost" id="logout" type="button">Cerrar sesión</button>
        </div>
        <p id="publishMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wsfdjmhpfqwunyguloqo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-1dCf4mJ0AgDVKXXUt7Z9g_wOA-jgmt';
    const ADMIN_PASSWORD = '12345';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = selector => document.querySelector(selector);

    const loginForm = $('#loginForm');
    const newsForm = $('#newsForm');
    const loginMessage = $('#loginMessage');
    const publishMessage = $('#publishMessage');
    const params = new URLSearchParams(location.search);

    const slugToCategory = {
      'presentacion':'Presentación',
      'opinion-personal':'Opinión personal',
      'educacion':'Educación',
      'salud':'Salud',
      'cultura':'Cultura',
      'investigacion':'Investigación',
      'desarrollo-local':'Desarrollo local',
      'deporte':'Deporte',
      'matando-el-tiempo':'Matando el tiempo',
      'tu-opinion-cuenta':'Tu opinión cuenta',
      'clasificados':'Clasificados'
    };

    const today = () =>
      new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);

    $('#date').value = today();

    if (slugToCategory[params.get('seccion')]) {
      $('#category').value = slugToCategory[params.get('seccion')];
    }

    function showEditor() {
      loginForm.classList.add('hidden');
      newsForm.classList.remove('hidden');
    }

    loginForm.addEventListener('submit', event => {
      event.preventDefault();

      if ($('#password').value === ADMIN_PASSWORD) {
        sessionStorage.setItem('lvj_admin_unlocked', 'yes');
        loginMessage.textContent = '';
        showEditor();
      } else {
        loginMessage.textContent = 'Contraseña incorrecta. Intenta nuevamente.';
        $('#password').value = '';
        $('#password').focus();
      }
    });

    if (sessionStorage.getItem('lvj_admin_unlocked') === 'yes') {
      showEditor();
    }

    function validImage(file) {
      return file &&
        file.type.startsWith('image/') &&
        file.size <= 10 * 1024 * 1024;
    }

    function preview(files, target) {
      target.innerHTML = '';

      for (const file of files) {
        if (!validImage(file)) {
          alert('Selecciona imágenes válidas de menos de 10 MB.');
          target.innerHTML = '';
          return false;
        }

        const image = document.createElement('img');
        image.alt = 'Vista previa';
        image.src = URL.createObjectURL(file);
        target.appendChild(image);
      }

      return true;
    }

    $('#cover').addEventListener('change', event => {
      preview(Array.from(event.target.files).slice(0, 1), $('#coverPreview'));
    });

    $('#gallery').addEventListener('change', event => {
      preview(Array.from(event.target.files), $('#galleryPreview'));
    });

    async function uploadImage(file, folder) {
      if (!validImage(file)) {
        throw new Error('Selecciona una fotografía válida de menos de 10 MB.');
      }

      const extension = (file.name.split('.').pop() || 'jpg')
        .toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';

      const path = folder + '/' + crypto.randomUUID() + '.' + extension;

      const { error } = await db.storage
        .from('noticias')
        .upload(path, file, {
          contentType: file.type,
          upsert: false
        });

      if (error) throw error;

      return db.storage.from('noticias').getPublicUrl(path).data.publicUrl;
    }

    newsForm.addEventListener('submit', async event => {
      event.preventDefault();

      const button = $('#publishButton');
      button.disabled = true;
      publishMessage.textContent = 'Subiendo fotografías y guardando la noticia…';

      try {
        const coverUrl = await uploadImage($('#cover').files[0], 'portadas');
        const gallery = [];

        for (const file of Array.from($('#gallery').files)) {
          const url = await uploadImage(file, 'galeria');
          gallery.push({
            url,
            alt: file.name,
            caption: ''
          });
        }

        const post = {
          title: $('#title').value.trim(),
          category: $('#category').value,
          date: $('#date').value,
          author: $('#author').value.trim(),
          summary: $('#summary').value.trim(),
          content: $('#content').value.trim(),
          cover_url: coverUrl,
          cover_alt: $('#coverAlt').value.trim(),
          cover_caption: $('#coverCaption').value.trim(),
          gallery
        };

        const { error } = await db.from('posts').insert(post);
        if (error) throw error;

        publishMessage.textContent =
          '¡Noticia publicada correctamente en Supabase!';

        newsForm.reset();
        $('#date').value = today();
        $('#coverPreview').innerHTML = '';
        $('#galleryPreview').innerHTML = '';

        if (slugToCategory[params.get('seccion')]) {
          $('#category').value = slugToCategory[params.get('seccion')];
        }
      } catch (error) {
        console.error(error);
        publishMessage.textContent =
          'No se pudo publicar: ' +
          (error.message || 'revisa las políticas de Supabase.');
      } finally {
        button.disabled = false;
      }
    });

    $('#clearForm').addEventListener('click', () => {
      newsForm.reset();
      $('#date').value = today();
      $('#coverPreview').innerHTML = '';
      $('#galleryPreview').innerHTML = '';
      publishMessage.textContent = '';

      if (slugToCategory[params.get('seccion')]) {
        $('#category').value = slugToCategory[params.get('seccion')];
      }
    });

    $('#logout').addEventListener('click', () => {
      sessionStorage.removeItem('lvj_admin_unlocked');
      newsForm.reset();
      newsForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      $('#password').value = '';
      publishMessage.textContent = '';
    });
  </script>
</body>
</html>
