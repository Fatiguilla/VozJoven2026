<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noticia | La Voz Joven</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ENCABEZADO -->
  <header class="site-header">
    <div class="container header-inner">

      <a class="brand" href="index.html">
        <img
          src="assets/logo-la-voz-joven.jpeg"
          alt="La Voz Joven"
          style="max-width:210px; max-height:70px; object-fit:contain;"
        >
      </a>

      <a class="nav-back" href="index.html">
        ← Página principal
      </a>

    </div>
  </header>

  <!-- CONTENIDO DEL ARTÍCULO -->
  <main class="article-page">

    <div id="articleContent">
      <p class="empty-news">Cargando noticia...</p>
    </div>

    <a class="nav-back" href="index.html">
      ← Volver a La Voz Joven
    </a>

  </main>

  <!-- CARGAR SUPABASE PRIMERO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CARGAR LAS FUNCIONES DEL PERIÓDICO -->
  <script src="newsroom.js"></script>

  <!-- MOSTRAR EL ARTÍCULO -->
  <script>
    window.addEventListener('load', function () {
      if (typeof window.lvjArticleRender === 'function') {
        window.lvjArticleRender();
      } else {
        const container = document.getElementById('articleContent');

        if (container) {
          container.innerHTML = `
            <h1>No se pudo cargar la noticia</h1>
            <p>Comprueba que newsroom.js se haya cargado correctamente.</p>
            <a href="index.html">Volver a la página principal</a>
          `;
        }
      }
    });
  </script>

</body>
</html>
